<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f6">
<title>FIVE</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
<link rel="icon" type="image/svg+xml" href="./lotus.svg?v=2">
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#192a27;--muted:#52635d;--gradient:linear-gradient(90deg,#a2d7c4,#87bfdc 55%,#b7ade9)}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#e5f2ed,transparent 420px),#f5f7f6;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:48px 20px max(32px,env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:32px}
svg{width:56px;height:48px}
.eyebrow,.index,footer{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(52px,12vw,80px);line-height:1;letter-spacing:.055em;color:#68786d;text-shadow:0 1px 0 #fff,0 2px 4px #39433120;margin:10px 0 12px;font-weight:700}
#ritual{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border:1px solid #dedfd7;border-radius:50%;background:linear-gradient(165deg,#faf9f4,#fff 78%);box-shadow:inset 0 2px 3px #fff,0 3px 0 #d6d9ce,0 10px 22px #39433120;display:grid;place-items:center}
#ritual button{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;box-shadow:none}
#ritual button:active{box-shadow:inset 0 3px 9px #39433124}
#ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fill{stroke-dasharray:100;stroke-dashoffset:100}
.running #fill{animation:fill 60s linear var(--phase) both}
#glow{opacity:0}
.running #glow{animation:pulse 6s ease-in-out var(--phase) 10}
@keyframes fill{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.38}}
#face,.outgoing{text-align:center;pointer-events:none;grid-area:1/1}
.outgoing{animation:dissolve 1.5s ease both}
@keyframes dissolve{to{opacity:0}}
#ritual.arrive{animation:arrive 1.8s ease both}
@keyframes arrive{from{opacity:0}}
#face.enter{animation:enter 1.5s ease both}
@keyframes enter{from{opacity:0}}
.step-label{display:block;font-size:clamp(24px,7vw,34px);letter-spacing:.1em;margin:8px 0}
.step-hint{display:block;color:var(--muted);font-size:13px;min-height:1.4em}
@media(prefers-reduced-motion:reduce){.running #glow,#face.enter,#ritual.arrive{animation:none}.outgoing{display:none}}
button{border:1px solid #dedfd7;border-radius:999px;background:linear-gradient(165deg,#faf9f4,#fff 78%);color:#304c41;font:600 14px system-ui,sans-serif;min-height:44px;padding:0 22px;cursor:pointer;box-shadow:0 2px 0 #d6d9ce,0 4px 7px #39433126}
button:focus-visible{outline:2px solid #214b40;outline-offset:3px}
#clear{display:block;margin:24px auto 0;font-size:13px}
#stage{display:grid;justify-items:center}
#stage > section{grid-area:1/1}
#end{width:min(100%,340px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;justify-items:center;text-align:center;background:radial-gradient(circle at 40% 25%,#59796d,#35554a);color:#fff}
#end.reveal{animation:enter 1.5s ease both}
#ritual.leave{animation:dissolve 1.5s ease both;pointer-events:none}
h2{font-size:clamp(42px,10vw,64px);line-height:1;letter-spacing:-.065em;margin:0 0 26px}
@media(prefers-reduced-motion:reduce){#end.reveal,#ritual.leave{animation:none}}
#views{display:grid}
#views > *{grid-area:1/1;min-width:0}
#setup,#welcome{width:min(100%,380px);align-self:start;margin:0 auto;padding:clamp(18px,5vw,28px);border:1px solid #dedfd7;border-radius:28px;background:linear-gradient(165deg,#faf9f4,#fff 78%);box-shadow:inset 0 2px 3px #fff,0 3px 0 #d6d9ce,0 10px 22px #39433120}
#welcome{text-align:center}
#welcome p{max-width:31ch;margin:0 auto 18px;line-height:1.65;color:var(--muted)}
#welcome p:first-child{color:#304c41;font-weight:600}
#welcome button{margin-top:4px}
#setup h2{text-align:center;font-size:28px;letter-spacing:-.035em;margin:0 0 22px;color:#304c41}
#setup label{display:grid;gap:6px;margin-bottom:12px;color:#304c41;font-size:13px;font-weight:600}
#setup input{box-sizing:border-box;width:100%;min-height:44px;border:1px solid #dedfd7;border-radius:13px;padding:8px 12px;font:400 16px system-ui,sans-serif;color:var(--ink);background:linear-gradient(#f3f3ed,#fff);box-shadow:inset 0 2px 4px #39433114}
#setup input:focus-visible{outline:2px solid #68786d;outline-offset:2px}
#setup-actions{display:flex;justify-content:center;gap:12px;margin-top:20px}
#names{padding-top:12px;border-top:1px solid #e7ebe5}
#actions{display:flex;justify-content:center;gap:12px;margin-top:24px}
#actions button{margin:0}
#face,.outgoing{max-width:76%;overflow-wrap:anywhere}
.step-label{font-size:clamp(17px,5vw,30px)}
[hidden]{display:none!important}
</style>
<main>
<header>
<svg viewBox="0 0 76 64" fill="none" aria-hidden="true"><path d="M38 59C10 54 2 42 5 32c12 0 25 9 33 27Zm0 0c28-5 36-17 33-27-12 0-25 9-33 27Zm0 0C17 49 10 32 14 19c14 4 23 20 24 40Zm0 0c21-10 28-27 24-40-14 4-23 20-24 40Zm0 0C25 42 25 21 38 6c13 15 13 36 0 53Z" stroke="#6d886e" stroke-width="1.4"/></svg>
<p class="eyebrow">A daily ritual</p>
<h1>FIVE</h1>
</header>
<div id="views">
<section id="welcome" aria-label="Welcome to FIVE" hidden>
<p>Welcome to FIVE.</p>
<p>Here, you'll sit with five (or however many) things you need to spend time with, today.</p>
<p>Choose how many. Name them.<br>
Then begin. You'll have 60 seconds to sit with each.</p>
<button id="continue" type="button">Begin</button>
</section>
<form id="setup" hidden>
<h2>Set up your ritual</h2>
<label>Number of steps <input id="count" type="number" min="1" max="20" required></label>
<div id="names"></div>
<div id="setup-actions"><button type="submit">Begin</button>
<button id="cancel" type="button" hidden>Cancel</button></div>
</form>
<div id="session" hidden>
<div id="stage">
<section id="ritual" aria-label="Ritual timer">
<svg id="ring" viewBox="0 0 340 340" fill="none" aria-hidden="true">
<defs><linearGradient id="ring-gradient" x2="100%" y2="100%"><stop stop-color="#a2d7c4"/><stop offset=".55" stop-color="#87bfdc"/><stop offset="1" stop-color="#b7ade9"/></linearGradient></defs>
<g transform="rotate(-90 170 170)" stroke-width="6">
<circle cx="170" cy="170" r="153" stroke="#edf1f0"/>
<circle id="fill" cx="170" cy="170" r="153" pathLength="100" stroke="url(#ring-gradient)" stroke-linecap="round"/>
<circle id="glow" cx="170" cy="170" r="153" stroke="url(#ring-gradient)"/>
</g>
</svg>
<div id="face" role="status"><span class="index" id="index"></span><strong id="label" class="step-label"></strong><span id="hint" class="step-hint">Tap to begin</span></div>
<button id="start" type="button"></button>
</section>
<section id="end" hidden><h2 tabindex="-1">thank you.</h2><button id="reset">Begin again</button></section>
</div>
<div id="actions"><button id="clear" type="button">Reset</button><button id="edit" type="button">Edit ritual</button></div>
</div>
</div>
</main>
<script>
const defaults = ['BREATHE', 'FOR HER', 'FOR THEM', 'FOR ME', 'BREATHE'];
const storageKey = 'five-public-ritual';
let labels = defaults;
let configured = false;
const setup = document.querySelector('#setup');
const welcome = document.querySelector('#welcome');
const next = document.querySelector('#continue');
const session = document.querySelector('#session');
const count = document.querySelector('#count');
const names = document.querySelector('#names');
const cancel = document.querySelector('#cancel');
let draft = [];
const duration = 60_000;
const ritual = document.querySelector('#ritual');
const face = document.querySelector('#face');
const start = document.querySelector('#start');
const clear = document.querySelector('#clear');
const end = document.querySelector('#end');
const index = document.querySelector('#index');
const label = document.querySelector('#label');
const hint = document.querySelector('#hint');
let completed = 0;
let deadline = 0;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (Array.isArray(saved?.labels) && saved.labels.length >= 1 && saved.labels.length <= 20 &&
      saved.labels.every(name => typeof name === 'string' && name.trim() && name.length <= 40)) {
    labels = saved.labels;
    configured = true;
  }
  if (configured && Number.isInteger(saved?.completed) && saved.completed >= 0 && saved.completed <= labels.length) {
    completed = saved.completed;
    deadline = Number.isFinite(saved.deadline) ? saved.deadline : 0;
  }
} catch {}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({ labels, completed, deadline })); } catch {}
}
function replay(element, name) {
  element.classList.remove(name);
  void element.offsetWidth;
  element.classList.add(name);
}
function crossfade() {
  ritual.querySelector('.outgoing')?.remove();
  if (label.textContent && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const previous = face.cloneNode(true);
    previous.removeAttribute('id');
    previous.removeAttribute('role');
    previous.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    previous.className = 'outgoing';
    previous.setAttribute('aria-hidden', 'true');
    ritual.insertBefore(previous, face);
    previous.addEventListener('animationend', () => previous.remove(), { once: true });
  }
  replay(face, 'enter');
}
function render() {
  const remaining = Math.max(0, deadline - Date.now());
  const advanced = completed < labels.length && deadline > 0 && remaining === 0;
  if (advanced) {
    completed++;
    deadline = 0;
    save();
  }
  const finished = completed === labels.length;
  const fading = finished && advanced && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  ritual.hidden = finished && !fading;
  clear.hidden = finished;
  end.hidden = !finished;
  if (finished) {
    if (fading) {
      ritual.classList.add('leave');
      end.classList.add('reveal');
    } else {
      ritual.classList.remove('running');
    }
    if (advanced && !session.hidden && !session.inert) end.querySelector('h2').focus();
    return;
  }
  const running = deadline > 0;
  if (running && !ritual.classList.contains('running')) {
    ritual.style.setProperty('--phase', (remaining - duration) + 'ms');
  }
  ritual.classList.toggle('running', running);
  start.hidden = running;
  if (advanced) crossfade();
  index.textContent = String(completed + 1).padStart(2, '0') + ' / ' + String(labels.length).padStart(2, '0');
  label.textContent = labels[completed];
  hint.textContent = running ? '' : 'Tap to begin';
  start.setAttribute('aria-label', 'Start ' + labels[completed] + ', step ' + (completed + 1));
  if (advanced && !session.hidden) start.focus();
}
start.addEventListener('click', () => {
  if (deadline || completed === labels.length) return;
  deadline = Date.now() + duration;
  save();
  render();
});
ritual.addEventListener('animationend', event => {
  if (event.target === ritual && event.animationName === 'dissolve' && completed === labels.length) {
    ritual.hidden = true;
    ritual.classList.remove('leave', 'running');
  }
});
function reset(animateEntrance = true) {
  ritual.classList.remove('leave', 'running');
  end.classList.remove('reveal');
  completed = deadline = 0;
  ritual.querySelector('.outgoing')?.remove();
  face.classList.remove('enter');
  save();
  render();
  if (animateEntrance) replay(ritual, 'arrive');
  else ritual.classList.remove('arrive');
  start.focus();
}
clear.addEventListener('click', reset);
document.querySelector('#reset').addEventListener('click', reset);
function renderNames() {
  if (!count.validity.valid) return;
  names.querySelectorAll('input').forEach((input, i) => { draft[i] = input.value; });
  names.replaceChildren();
  for (let i = 0; i < count.valueAsNumber; i++) {
    const caption = document.createElement('label');
    caption.textContent = 'Step ' + (i + 1);
    const input = document.createElement('input');
    input.type = 'text';
    input.required = true;
    input.maxLength = 40;
    input.pattern = '.*\\S.*';
    input.value = draft[i] ?? '';
    caption.append(input);
    names.append(caption);
  }
}
let viewAnimations = [];
function showView(incoming, outgoing) {
  const outgoingWasVisible = !outgoing.hidden;
  const incomingOpacity = incoming.hidden ? 0 : Number(getComputedStyle(incoming).opacity);
  const outgoingOpacity = outgoingWasVisible ? Number(getComputedStyle(outgoing).opacity) : 0;
  viewAnimations.forEach(animation => animation.cancel());
  viewAnimations = [];
  incoming.hidden = false;
  incoming.inert = false;
  outgoing.inert = true;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    outgoing.hidden = true;
    return;
  }
  const timing = { duration: 1500, easing: 'ease' };
  viewAnimations.push(incoming.animate([{ opacity: incomingOpacity }, { opacity: 1 }], timing));
  if (outgoingWasVisible) {
    const fade = outgoing.animate([{ opacity: outgoingOpacity }, { opacity: 0 }], timing);
    viewAnimations.push(fade);
    fade.onfinish = () => { outgoing.hidden = true; };
  }
}
function openSetup(outgoing = session) {
  draft = [...labels];
  names.replaceChildren();
  count.value = labels.length;
  renderNames();
  cancel.hidden = !configured;
  showView(setup, outgoing);
}
next.addEventListener('click', () => {
  openSetup(welcome);
  count.focus();
});
count.addEventListener('input', renderNames);
document.querySelector('#edit').addEventListener('click', () => {
  openSetup();
  count.focus();
});
cancel.addEventListener('click', () => {
  showView(session, setup);
  document.querySelector('#edit').focus();
});
setup.addEventListener('submit', event => {
  event.preventDefault();
  labels = Array.from(names.querySelectorAll('input'), input => input.value.trim());
  configured = true;
  showView(session, setup);
  reset(false);
});
if (configured) {
  session.hidden = false;
  render();
} else {
  showView(welcome, setup);
}
if (configured && completed === 0 && !deadline) replay(ritual, 'arrive');
setInterval(() => { if (deadline && completed < labels.length && Date.now() >= deadline) render(); }, 200);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  ritual.classList.remove('running');
  render();
});
</script>
</html>
